<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casamento Ailka & Vínicius</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;700&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <header class="header">
        <h1>Ailka & Vínicius</h1>
    </header>

    <main class="content">
        <p class="welcome-text">Bem-vindos ao nosso começo!</p>

        <div class="carousel-container">
            <button class="carousel-btn prev-btn"><i class="fas fa-chevron-left"></i></button>
            <div class="image-carousel">
                <div class="carousel-item active">
                    <img src="./Assets/casal.webp" alt="Foto do casal 1">
                </div>
                <div class="carousel-item">
                    <img src="./Assets/casal.webp" alt="Foto do casal 2">
                </div>
                <div class="carousel-item">
                    <img src="./Assets/casal.webp" alt="Foto do casal 3">
                </div>
                <div class="carousel-item">
                    <img src="./Assets/casal.webp" alt="Foto do casal 4">
                </div>
            </div>
            <button class="carousel-btn next-btn"><i class="fas fa-chevron-right"></i></button>
        </div>

        <div class="buttons">
            <a href="#" class="btn">Relembre nossa história</a>
            <a href="#" class="btn">Lista de presentes</a>
            <a href="#" class="btn">Confirme sua presença</a>
        </div>
    </main>

    <script src="index.js"></script>
</body>
</html>
